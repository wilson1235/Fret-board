<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>指板幾何視覺化 - Studio Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=SF+Pro+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-metal: #121316;
      --panel-bg: rgba(30, 32, 38, 0.78);
      --panel-border: rgba(255, 255, 255, 0.12);
      --panel-bevel: inset 0 1px 1px rgba(255, 255, 255, 0.18);
      --panel-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      --text-main: #F5F5F7;
      --text-sub: #86868B;
      --wood-dark: #1E1715;
      
      /* 預設主題：經典工作室 */
      --c-root: #FF3B30;     /* Root 主音 */
      --c-bg: #2C2C2E;       /* 暗底襯底色 */
      --c-accent1: #FF9500;  /* 強調色 A */
      --c-accent2: #007AFF;  /* 強調色 B */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-metal);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* 頂部極簡標題 */
    header {
      position: absolute;
      top: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.85;
    }
    .badge-studio {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--panel-border);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 1.5px;
    }
    .app-title { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }

    /* 中央指板工作區 */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: -15px;
    }

    /* 緊貼指板正上方的畫筆與和弦工具列 */
    .top-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: var(--panel-bevel), var(--panel-shadow);
    }
    .tool-group { display: flex; align-items: center; gap: 6px; }
    .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.12); margin: 0 4px; }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      font-size: 13px;
    }
    .tool-btn.active {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.3);
    }

    /* 色票按鈕 */
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .color-swatch.active { border-color: #FFF; box-shadow: 0 0 10px rgba(255,255,255,0.6); }

    .select-input {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--panel-border);
      color: #FFF;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
    }

    /* 指板外框容器（相對定位以放置浮動徽章） */
    .fretboard-box {
      position: relative;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
      display: inline-block;
    }

    /* 指板左上方：即時和弦辨識徽章 */
    .chord-detector-badge {
      position: absolute;
      top: 14px;
      left: 18px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(20, 22, 26, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .chord-detector-badge.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
    }
    .detector-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34C759;
      box-shadow: 0 0 8px rgba(52, 199, 89, 0.7);
    }
    .chord-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #FFFFFF;
    }
    .chord-alt {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      margin-left: 2px;
    }

    canvas { display: block; cursor: crosshair; }

    /* 底部 macOS Dock */
    footer {
      position: absolute;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 18px;
      background: var(--panel-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: var(--panel-bevel), var(--panel-shadow);
    }
    .dock-btn {
      padding: 7px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }
    .dock-btn:hover { background: rgba(255,255,255,0.12); }

    /* 抽屜式側邊面板 */
    aside {
      position: fixed;
      right: -360px;
      top: 0;
      width: 340px;
      height: 100vh;
      background: rgba(24, 25, 29, 0.95);
      backdrop-filter: blur(30px);
      border-left: 1px solid var(--panel-border);
      box-shadow: -10px 0 40px rgba(0,0,0,0.6);
      z-index: 100;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    aside.open { right: 0; }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>

  <header>
    <span class="badge-studio">STUDIO</span>
    <span class="app-title">指板幾何視覺化</span>
  </header>

  <main>
    <!-- 頂部吸附工具列 -->
    <div class="top-toolbar">
      <!-- 5 種幾何圖形 -->
      <div class="tool-group">
        <button class="tool-btn active" data-shape="circle" title="實心圓">●</button>
        <button class="tool-btn" data-shape="ring" title="空心圈">○</button>
        <button class="tool-btn" data-shape="diamond" title="菱形">◆</button>
        <button class="tool-btn" data-shape="triangle" title="三角形">▲</button>
        <button class="tool-btn" data-shape="cross" title="悶音叉叉">✕</button>
      </div>

      <div class="divider"></div>

      <!-- 4 色色票體系 -->
      <div class="tool-group">
        <div class="color-swatch active" data-color="root" style="background: var(--c-root); color: #FFF;" title="Root 主音">R</div>
        <div class="color-swatch" data-color="bg" style="background: var(--c-bg);" title="暗底襯底色"></div>
        <div class="color-swatch" data-color="accent1" style="background: var(--c-accent1);" title="強調色 A"></div>
        <div class="color-swatch" data-color="accent2" style="background: var(--c-accent2);" title="強調色 B"></div>
      </div>

      <div class="divider"></div>

      <!-- CAGED 與和弦快選 -->
      <div class="tool-group">
        <select id="chord-root" class="select-input">
          <option value="0">C</option><option value="1">C#</option><option value="2">D</option><option value="3">D#</option>
          <option value="4">E</option><option value="5">F</option><option value="6">F#</option><option value="7">G</option>
          <option value="8">G#</option><option value="9">A</option><option value="10">A#</option><option value="11">B</option>
        </select>
        <select id="chord-type" class="select-input">
          <option value="maj">Maj</option><option value="min">min</option><option value="7">7</option>
          <option value="maj7">Maj7</option><option value="m7">m7</option><option value="m7b5">m7b5</option>
          <option value="dim7">dim7</option><option value="sus4">sus4</option><option value="add9">add9</option>
        </select>
      </div>

      <div class="tool-group">
        <button class="tool-btn caged-btn" data-shape-key="C">C</button>
        <button class="tool-btn caged-btn" data-shape-key="A">A</button>
        <button class="tool-btn caged-btn" data-shape-key="G">G</button>
        <button class="tool-btn caged-btn" data-shape-key="E">E</button>
        <button class="tool-btn caged-btn" data-shape-key="D">D</button>
      </div>
    </div>

    <!-- 指板本體與即時辨識徽章 -->
    <div class="fretboard-box">
      <div id="chord-detector-badge" class="chord-detector-badge hidden" title="點擊切換同音異名">
        <span class="detector-dot"></span>
        <span id="detected-chord-name" class="chord-title">--</span>
        <span id="detected-chord-alt" class="chord-alt"></span>
      </div>
      <canvas id="fretboard" width="1080" height="280"></canvas>
    </div>
  </main>

  <!-- 底部 macOS Dock -->
  <footer>
    <div class="tool-group">
      <button id="btn-toggle-display" class="dock-btn">顯示：音名</button>
      <button id="btn-clear" class="dock-btn">清空指板</button>
      <button id="btn-sound" class="dock-btn">發聲：開</button>
      <button id="btn-export" class="dock-btn">匯出 Retina 圖片</button>
    </div>
    <div class="divider"></div>
    <button id="btn-open-drawer" class="dock-btn">調弦 / 樂器設定 ⚙</button>
  </footer>

  <!-- 抽屜式側邊欄 -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside id="settings-drawer">
    <h3 style="font-size: 16px; margin-bottom: 8px;">樂器與各弦調音</h3>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <label style="font-size:12px; color:var(--text-sub);">樂器預設</label>
      <select id="instrument-select" class="select-input">
        <option value="guitar_6" selected>6 弦吉他 (E A D G B E)</option>
        <option value="guitar_7">7 弦吉他 (+B)</option>
        <option value="bass_4">4 弦貝斯 (E A D G)</option>
        <option value="bass_5">5 弦貝斯 (+B)</option>
        <option value="ukulele_4">4 弦烏克麗麗 (G C E A)</option>
      </select>
    </div>
    <div style="margin-top: 15px;">
      <label style="font-size:12px; color:var(--text-sub);">主題色調</label>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="dock-btn theme-btn" data-theme="studio">工作室原創</button>
        <button class="dock-btn theme-btn" data-theme="cyber">冷冽賽博</button>
      </div>
    </div>
  </aside>

  <script>
    // --- 核心音階與和弦定義 ---
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const CHORD_FORMULAS = [
      { suffix: '', intervals: [0, 4, 7] },
      { suffix: 'm', intervals: [0, 3, 7] },
      { suffix: 'dim', intervals: [0, 3, 6] },
      { suffix: 'aug', intervals: [0, 4, 8] },
      { suffix: 'sus4', intervals: [0, 5, 7] },
      { suffix: 'sus2', intervals: [0, 2, 7] },
      { suffix: '7', intervals: [0, 4, 7, 10] },
      { suffix: 'maj7', intervals: [0, 4, 7, 11] },
      { suffix: 'm7', intervals: [0, 3, 7, 10] },
      { suffix: 'mMaj7', intervals: [0, 3, 7, 11] },
      { suffix: 'm7b5', intervals: [0, 3, 6, 10] },
      { suffix: 'dim7', intervals: [0, 3, 6, 9] },
      { suffix: '6', intervals: [0, 4, 7, 9] },
      { suffix: 'm6', intervals: [0, 3, 7, 9] },
      { suffix: 'add9', intervals: [0, 2, 4, 7] },
      { suffix: '9', intervals: [0, 2, 4, 7, 10] },
      { suffix: 'maj9', intervals: [0, 2, 4, 7, 11] },
      { suffix: 'm9', intervals: [0, 2, 3, 7, 10] },
      { suffix: '5', intervals: [0, 7] }
    ];

    // --- 應用狀態 ---
    const state = {
      shape: 'circle',
      color: 'root',
      displayMode: 'note', // 'note' 或 'degree'
      sound: true,
      currentTuning: [64, 59, 55, 50, 45, 40], // 1弦至6弦 (E4, B3, G3, D3, A2, E2)
      placedNotes: [], // { stringIdx, fret, shape, color }
      rootPitch: 0 // 當前定調 Root (0 = C)
    };

    let detectedMatches = [];
    let detectedMatchIdx = 0;

    // --- DOM 快取 ---
    const canvas = document.getElementById('fretboard');
    const ctx = canvas.getContext('2d');
    const detectorBadge = document.getElementById('chord-detector-badge');
    const detectedTitle = document.getElementById('detected-chord-name');
    const detectedAlt = document.getElementById('detected-chord-alt');

    // --- Web Audio 擬真琴聲合成 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playGuitarTone(midi) {
      if (!state.sound) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    // --- 和弦即時辨識 (Reverse Chord Identifier) ---
    function identifyChords() {
      const active = state.placedNotes
        .filter(n => n.shape !== 'cross')
        .map(n => {
          const midi = state.currentTuning[n.stringIdx] + n.fret;
          return { midi, pc: midi % 12 };
        })
        .sort((a, b) => a.midi - b.midi);

      if (active.length < 2) return [];

      const bassPc = active[0].pc;
      const uniquePcs = Array.from(new Set(active.map(n => n.pc)));
      const matches = [];

      for (const root of uniquePcs) {
        const intervals = uniquePcs.map(p => (p - root + 12) % 12).sort((a, b) => a - b);
        const key = intervals.join(',');
        for (const f of CHORD_FORMULAS) {
          if (f.intervals.join(',') === key) {
            const rootName = NOTE_NAMES[root];
            const isSlash = root !== bassPc;
            const bassName = NOTE_NAMES[bassPc];
            matches.push({
              fullName: `${rootName}${f.suffix}${isSlash ? '/' + bassName : ''}`,
              isBassRoot: !isSlash
            });
          }
        }
      }
      return matches.sort((a, b) => (b.isBassRoot ? 1 : 0) - (a.isBassRoot ? 1 : 0));
    }

    function updateDetectedChordBadge() {
      detectedMatches = identifyChords();
      detectedMatchIdx = 0;
      if (detectedMatches.length === 0) {
        detectorBadge.classList.add('hidden');
        return;
      }
      detectorBadge.classList.remove('hidden');
      renderBadgeContent();
    }

    function renderBadgeContent() {
      const cur = detectedMatches[detectedMatchIdx];
      detectedTitle.textContent = cur.fullName;
      detectedAlt.textContent = detectedMatches.length > 1 ? `(${detectedMatchIdx + 1}/${detectedMatches.length})` : '';
    }

    detectorBadge.addEventListener('click', () => {
      if (detectedMatches.length > 1) {
        detectedMatchIdx = (detectedMatchIdx + 1) % detectedMatches.length;
        renderBadgeContent();
      }
    });

    // --- 繪圖引擎 (Retina Canvas 2X) ---
    const TOTAL_FRETS = 15;
    const NUT_WIDTH = 12;
    const PADDING_LEFT = 40;
    const PADDING_TOP = 30;
    const FRET_W = 66;

    function renderFretboard() {
      const numStrings = state.currentTuning.length;
      const boardH = 220;
      const stringSpacing = boardH / (numStrings - 1);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 琴木背景
      ctx.fillStyle = '#1C1614';
      ctx.fillRect(PADDING_LEFT, PADDING_TOP, TOTAL_FRETS * FRET_W, boardH);

      // 琴枕 (Nut)
      ctx.fillStyle = '#E6E1D3';
      ctx.fillRect(PADDING_LEFT - NUT_WIDTH, PADDING_TOP - 2, NUT_WIDTH, boardH + 4);

      // 品絲 (Frets)
      for (let f = 1; f <= TOTAL_FRETS; f++) {
        const x = PADDING_LEFT + f * FRET_W;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(x, PADDING_TOP, 2, boardH);

        // 鑲嵌點 (Inlays)
        if ([3, 5, 7, 9, 12, 15].includes(f)) {
          const midX = x - FRET_W / 2;
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          if (f === 12) {
            ctx.beginPath();
            ctx.arc(midX, PADDING_TOP + boardH * 0.3, 4, 0, Math.PI * 2);
            ctx.arc(midX, PADDING_TOP + boardH * 0.7, 4, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(midX, PADDING_TOP + boardH / 2, 4.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // 琴弦 (Strings)
      for (let s = 0; s < numStrings; s++) {
        const y = PADDING_TOP + s * stringSpacing;
        const thickness = 1 + (numStrings - 1 - s) * 0.45;
        ctx.fillStyle = 'rgba(215, 220, 225, 0.75)';
        ctx.fillRect(PADDING_LEFT - NUT_WIDTH, y - thickness / 2, TOTAL_FRETS * FRET_W + NUT_WIDTH, thickness);
      }

      // 標記點繪製
      state.placedNotes.forEach(note => {
        const y = PADDING_TOP + note.stringIdx * stringSpacing;
        const x = note.fret === 0 ? PADDING_LEFT - NUT_WIDTH / 2 : PADDING_LEFT + note.fret * FRET_W - FRET_W / 2;
        
        let color = '#2C2C2E';
        if (note.color === 'root') color = '#FF3B30';
        else if (note.color === 'accent1') color = '#FF9500';
        else if (note.color === 'accent2') color = '#007AFF';

        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;

        // 幾何形狀
        if (note.shape === 'circle') {
          ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
        } else if (note.shape === 'ring') {
          ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.stroke();
        } else if (note.shape === 'diamond') {
          ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x + 13, y); ctx.lineTo(x, y + 13); ctx.lineTo(x - 13, y); ctx.closePath(); ctx.fill();
        } else if (note.shape === 'triangle') {
          ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x + 12, y + 10); ctx.lineTo(x - 12, y + 10); ctx.closePath(); ctx.fill();
        } else if (note.shape === 'cross') {
          ctx.strokeStyle = '#FF453A'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x - 8, y - 8); ctx.lineTo(x + 8, y + 8); ctx.moveTo(x + 8, y - 8); ctx.lineTo(x - 8, y + 8); ctx.stroke();
        }

        // 文字（音名或度數）
        if (note.shape !== 'cross') {
          const midi = state.currentTuning[note.stringIdx] + note.fret;
          const text = state.displayMode === 'note' ? NOTE_NAMES[midi % 12] : `${((midi % 12) - state.rootPitch + 12) % 12 || 'R'}`;
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '600 11px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(text, x, y);
        }
        ctx.restore();
      });
    }

    // --- 互動與標記點擊 ---
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const numStrings = state.currentTuning.length;
      const stringSpacing = 220 / (numStrings - 1);
      
      const sIdx = Math.round((clickY - PADDING_TOP) / stringSpacing);
      if (sIdx < 0 || sIdx >= numStrings) return;

      let fret = -1;
      if (clickX >= PADDING_LEFT - NUT_WIDTH && clickX <= PADDING_LEFT) {
        fret = 0;
      } else if (clickX > PADDING_LEFT) {
        fret = Math.ceil((clickX - PADDING_LEFT) / FRET_W);
      }
      if (fret < 0 || fret > TOTAL_FRETS) return;

      // 切換開關邏輯
      const existIdx = state.placedNotes.findIndex(n => n.stringIdx === sIdx && n.fret === fret);
      if (existIdx >= 0) {
        state.placedNotes.splice(existIdx, 1);
      } else {
        const midi = state.currentTuning[sIdx] + fret;
        let appliedColor = state.color;

        // 規則：音程 1 自動上 Root 色；若主動標記 Root 則定調並降階舊 Root
        if (appliedColor === 'root') {
          state.rootPitch = midi % 12;
          state.placedNotes.forEach(n => { if (n.color === 'root') n.color = 'bg'; });
          state.color = 'bg';
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          document.querySelector('.color-swatch[data-color="bg"]')?.classList.add('active');
        }

        state.placedNotes.push({ stringIdx: sIdx, fret, shape: state.shape, color: appliedColor });
        playGuitarTone(midi);
      }

      renderFretboard();
      updateDetectedChordBadge();
    });

    // --- 工具列切換事件 ---
    document.querySelectorAll('.tool-btn[data-shape]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn[data-shape]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.shape = btn.dataset.shape;
      });
    });

    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        state.color = swatch.dataset.color;
      });
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      state.placedNotes = [];
      renderFretboard();
      updateDetectedChordBadge();
    });

    document.getElementById('btn-toggle-display').addEventListener('click', (e) => {
      state.displayMode = state.displayMode === 'note' ? 'degree' : 'note';
      e.target.textContent = state.displayMode === 'note' ? '顯示：音名' : '顯示：度數';
      renderFretboard();
    });

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      state.sound = !state.sound;
      e.target.textContent = state.sound ? '發聲：開' : '發聲：靜音';
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'fretboard-studio.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 抽屜控制
    const drawer = document.getElementById('settings-drawer');
    const backdrop = document.getElementById('drawer-backdrop');
    document.getElementById('btn-open-drawer').addEventListener('click', () => {
      drawer.classList.add('open');
      backdrop.classList.add('open');
    });
    backdrop.addEventListener('click', () => {
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
    });

    // 初始化
    renderFretboard();
  </script>
</body>
</html>
