    }

    function changeFretboardStyle(styleKey) {
      currentFretboardStyle = styleKey;
      document.querySelectorAll('.wood-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`fret-btn-${styleKey}`);
      if (activeCard) activeCard.classList.add('active');
      renderBoard();
    }

    function populateScaleNotes() {
      activeMarkers.clear();
      const scaleNotes = SCALES[currentScale] ? SCALES[currentScale].notes : [];
      const numStrings = currentTuningMIDI.length;

      for (let s = 0; s < numStrings; s++) {
        for (let f = 0; f <= FRETS; f++) {
          const midi = currentTuningMIDI[s] + f;
          const interval = ((midi - currentRoot) % 12 + 12) % 12;
          if (scaleNotes.includes(interval)) {
            const roleKey = (interval === 0) ? 'c1' : 'c2';
            activeMarkers.set(`${s}-${f}`, { s, f, shape: currentSelectedShape, colorKey: roleKey });
          }
        }
      }
    }

    function toggleScaleSync() {
      isScaleSyncActive = !isScaleSyncActive;
      document.getElementById('btn-scale-sync').classList.toggle('sync-active', isScaleSyncActive);
      if (isScaleSyncActive) populateScaleNotes(); else activeMarkers.clear();
      renderBoard();
    }

    function changeRoot(rootVal) {
      currentRoot = parseInt(rootVal, 10);
      if (isScaleSyncActive) populateScaleNotes();
      renderBoard();
    }

    function changeScaleType(scaleVal) {
      currentScale = scaleVal;
      if (isScaleSyncActive) populateScaleNotes();
      renderBoard();
    }

    function setDisplayMode(mode) {
      displayMode = mode;
      document.querySelectorAll('.dock-group button').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${mode}`).classList.add('active');
      renderBoard();
    }

    function clearMarkers() {
      isScaleSyncActive = false;
      document.getElementById('btn-scale-sync').classList.remove('sync-active');
      activeMarkers.clear();
      renderBoard();
    }

    const dragBtn = document.getElementById('sidebar-trigger-btn');
    const panel = document.getElementById('sidebar-panel');
    const overlay = document.getElementById('sidebar-overlay');
    let isDragging = false, startX_p = 0, startY_p = 0, initialX = 0, initialY = 0, hasMoved = false;
    let sidebarHoverCloseTimer = null;

    function openSidebar() { panel.classList.add('open'); dragBtn.classList.add('open'); overlay.classList.add('active'); }
    function closeSidebar() { panel.classList.remove('open'); dragBtn.classList.remove('open'); overlay.classList.remove('active'); }
    function toggleSidebar() { panel.classList.contains('open') ? closeSidebar() : openSidebar(); }

    function cancelSidebarHoverClose() {
      if (sidebarHoverCloseTimer) clearTimeout(sidebarHoverCloseTimer);
      sidebarHoverCloseTimer = null;
    }

    function scheduleSidebarHoverClose() {
      if (!window.matchMedia('(hover: hover)').matches) return;
      cancelSidebarHoverClose();
      sidebarHoverCloseTimer = setTimeout(() => {
        if (!dragBtn.matches(':hover') && !panel.matches(':hover')) closeSidebar();
      }, 240);
    }

    if (window.matchMedia('(hover: hover)').matches) {
      dragBtn.addEventListener('mouseenter', () => {
        cancelSidebarHoverClose();
        openSidebar();
      });
      dragBtn.addEventListener('mouseleave', scheduleSidebarHoverClose);
      panel.addEventListener('mouseenter', cancelSidebarHoverClose);
      panel.addEventListener('mouseleave', scheduleSidebarHoverClose);
    }

    panel.addEventListener('pointerdown', e => e.stopPropagation());
    document.addEventListener('pointerdown', e => {
      if (panel.classList.contains('open') && !dragBtn.contains(e.target)) closeSidebar();
    });

    dragBtn.addEventListener('pointerdown', e => {
      isDragging = true; hasMoved = false; startX_p = e.clientX; startY_p = e.clientY;
      const rect = dragBtn.getBoundingClientRect(); initialX = rect.left; initialY = rect.top;
      dragBtn.setPointerCapture(e.pointerId);
    });

    dragBtn.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - startX_p, dy = e.clientY - startY_p;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
        hasMoved = true;
        dragBtn.classList.add('is-dragging');
        dragBtn.classList.remove('dock-left', 'dock-right');
        const nextX = Math.max(8, Math.min(window.innerWidth - 56, initialX + dx));
        const nextY = Math.max(20, Math.min(window.innerHeight - 120, initialY + dy));
        dragBtn.style.left = `${nextX}px`; dragBtn.style.top = `${nextY}px`; dragBtn.style.right = 'auto';
      }
    });

    dragBtn.addEventListener('pointerup', e => {
      if (!isDragging) return;
      isDragging = false; dragBtn.releasePointerCapture(e.pointerId);
      dragBtn.classList.remove('is-dragging');
      if (!hasMoved) {
        if (e.pointerType === 'mouse' && window.matchMedia('(hover: hover)').matches) openSidebar();
        else toggleSidebar();
      } else {
        const btnMid = dragBtn.getBoundingClientRect().left + 24;
        const screenMid = window.innerWidth / 2;
        if (btnMid < screenMid) {
          dragBtn.style.left = '0px'; dragBtn.style.right = 'auto';
          dragBtn.classList.add('dock-left'); panel.className = 'sidebar-panel panel-left';
        } else {
          dragBtn.style.left = 'auto'; dragBtn.style.right = '0px';
          dragBtn.classList.add('dock-right'); panel.className = 'sidebar-panel panel-right';
        }
      }
    });

    function exportFretboardPNG() {
      const scale = 2;
      const numStrings = currentTuningMIDI.length;
      const boardW = FRETS * fretWidth;
      const boardH = (numStrings - 1) * stringSpacing + 20;
      const totalW = 1030;
      const totalH = boardH + startY + 28;

      const canvas = document.createElement('canvas');
      canvas.width = totalW * scale; canvas.height = totalH * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      const style = FRETBOARD_STYLES[currentFretboardStyle];

      const woodGrad = ctx.createLinearGradient(0, startY - 10, 0, startY - 10 + boardH);
      style.bg.forEach((c, i) => woodGrad.addColorStop(i / (style.bg.length - 1), c));
      ctx.fillStyle = woodGrad;
      ctx.fillRect(startX, startY - 10, boardW, boardH);

      ctx.strokeStyle = style.binding; ctx.lineWidth = 1.6;
      ctx.strokeRect(startX, startY - 10, boardW, boardH);

      const nutW = style.nut.width;
      const nutGrad = ctx.createLinearGradient(startX - nutW, 0, startX, 0);
      style.nut.fill.forEach((c, i) => nutGrad.addColorStop(i / (style.nut.fill.length - 1), c));
      ctx.fillStyle = nutGrad;
      ctx.fillRect(startX - nutW, startY - 10, nutW, boardH);
      ctx.strokeStyle = style.nut.stroke; ctx.lineWidth = 1.2;
      ctx.strokeRect(startX - nutW, startY - 10, nutW, boardH);

      [3, 5, 7, 9, 12, 15].forEach(f => {
        if (f > FRETS) return;
        const ix = startX + (f - 0.5) * fretWidth;
        const midY = startY + ((numStrings - 1) * stringSpacing) / 2;
        ctx.fillStyle = style.inlay; ctx.globalAlpha = style.inlayOpacity;
        if (f === 12) {
          ctx.beginPath(); ctx.arc(ix, midY - 15, 3.8, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ix, midY + 15, 3.8, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(ix, midY, 4.2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      });

      ctx.font = '500 11.5px "JetBrains Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let f = 1; f <= FRETS; f++) {
        const fx = startX + f * fretWidth;
        ctx.strokeStyle = style.shadow; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(fx + 1, startY - 10); ctx.lineTo(fx + 1, startY - 10 + boardH); ctx.stroke();

        ctx.strokeStyle = style.wire; ctx.lineWidth = 2.0;
        ctx.beginPath(); ctx.moveTo(fx, startY - 10); ctx.lineTo(fx, startY - 10 + boardH); ctx.stroke();

        ctx.fillStyle = style.fretNum;
        ctx.fillText(f, fx - fretWidth / 2, startY + boardH + 16);
      }

      for (let s = 0; s < numStrings; s++) {
        const sy = startY + s * stringSpacing;
        const thick = 0.95 + (s * (2.4 / (numStrings - 1 || 1)));
        ctx.strokeStyle = s < 2 ? "#525b6a" : "#1e293b";
        ctx.lineWidth = thick; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(startX - nutW - 10, sy); ctx.lineTo(startX + boardW, sy); ctx.stroke();
      }

      ctx.font = '600 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const curPal = PALETTE_GROUPS[currentActivePalette];

      activeMarkers.forEach((markerData) => {
        const { s, f, shape, colorKey } = markerData;
        const color = curPal[colorKey] || curPal.c1;
        const mx = f === 0 ? startX - (nutW + 12) / 2 : startX + (f - 0.5) * fretWidth;
        const my = startY + s * stringSpacing;
        const midi = currentTuningMIDI[s] + f;
        const noteName = NOTE_NAMES[midi % 12];
        const interval = ((midi - currentRoot) % 12 + 12) % 12;
        const degreeName = DEGREE_NAMES[interval];

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;

        if (shape === 'circle') {
          ctx.fillStyle = color; ctx.beginPath(); ctx.arc(mx, my, 11.2, 0, Math.PI * 2); ctx.fill();
        } else if (shape === 'ring') {
          ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(mx, my, 9.8, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = color; ctx.lineWidth = 2.8; ctx.stroke();
        } else if (shape === 'diamond') {
          ctx.fillStyle = color; ctx.beginPath();
          ctx.moveTo(mx, my - 13); ctx.lineTo(mx + 13, my); ctx.lineTo(mx, my + 13); ctx.lineTo(mx - 13, my);
          ctx.closePath(); ctx.fill();
        } else if (shape === 'triangle') {
          ctx.fillStyle = color; ctx.beginPath();
          ctx.moveTo(mx, my - 12); ctx.lineTo(mx + 12.5, my + 9); ctx.lineTo(mx - 12.5, my + 9);
          ctx.closePath(); ctx.fill();
        } else if (shape === 'cross') {
          ctx.strokeStyle = "#8e8e93"; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(mx - 6, my - 6); ctx.lineTo(mx + 6, my + 6);
          ctx.moveTo(mx + 6, my - 6); ctx.lineTo(mx - 6, my + 6);
          ctx.stroke();
        }
        ctx.restore();

        if (displayMode !== 'dot' && shape !== 'cross') {
          ctx.fillStyle = '#ffffff';
          const labelY = shape === 'triangle' ? my + 2 : my;
          ctx.fillText(displayMode === 'note' ? noteName : degreeName, mx, labelY);
        }
      });

      const pngURL = canvas.toDataURL('image/png');
      const downloadLink = document.createElement('a');
      const rootName = NOTE_NAMES[currentRoot];
      downloadLink.download = `${INSTRUMENTS[currentInstrumentKey].name}_${rootName}_${currentScale}.png`;
      downloadLink.href = pngURL;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    renderQuickColorBar();
    renderPaletteCards();
    renderTuningControls();
    renderLeadSheetCards();
    renderBoard();
  </script>
</body>
</html>
